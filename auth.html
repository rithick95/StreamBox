<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamBox sign-in</title>
<style>body{background:#0a0f1c;color:#eef1f8;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:20px}h2{margin:0 0 8px}button,a{background:#ff3d57;color:#fff;border:0;border-radius:8px;padding:14px 22px;font-size:17px;font-weight:700;text-decoration:none;display:inline-block;margin-top:16px}</style>
<script src="https://accounts.google.com/gsi/client" async defer></script></head>
<body><div><h2>StreamBox</h2><p id="m">Sign in so the app can read your Drive videos.</p><div id="b"><button id="go">Sign in with Google</button></div></div>
<script>
const q=new URLSearchParams(location.search),cid=q.get('cid'),hint=q.get('hint'),add=q.get('add')==='1';
const m=document.getElementById('m'),b=document.getElementById('b');
document.getElementById('go').onclick=()=>{
  if(!cid){m.textContent='Missing Client ID. Open this from the StreamBox app.';return}
  if(!window.google){m.textContent='Google sign-in is still loading. Try again.';return}
  google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.readonly',callback:r=>{
    if(!r.access_token){m.textContent='Sign-in failed: '+(r.error||'unknown');return}
    const u='intent://auth?token='+encodeURIComponent(r.access_token)+'&exp='+(r.expires_in||3600)+'#Intent;scheme=streambox;package=com.streambox.app;end';
    m.textContent='Signed in. Tap the button to return to StreamBox.';
    b.innerHTML='<a href="'+u+'">Return to StreamBox</a>';
    location.href=u;
  }}).requestAccessToken(add||!hint?{prompt:'select_account'}:{prompt:'',hint:hint});
};
</script></body></html>
